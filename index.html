<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090b"><title>Riccardo Workout</title><style>
*{box-sizing:border-box}body{margin:0;background:#09090b;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header,main{max-width:900px;margin:auto;padding:0 16px}header{padding-top:25px}.eyebrow{font-size:10px;letter-spacing:.16em;color:#9b9ba5;font-weight:800}
h1{margin:5px 0;font-size:31px}.hero{padding:22px 0 18px}.hero h2{margin:5px 0;font-size:25px}.hero p{margin:0;color:#9b9ba5;line-height:1.5}
.tabs{display:flex;gap:8px;margin-bottom:18px}.tab{flex:1;border:1px solid #2b2b31;background:#151518;color:#ddd;padding:12px;border-radius:12px;font-weight:800;cursor:pointer}.tab.active{background:#fff;color:#09090b}
.selector{background:#151518;border:1px solid #2b2b31;border-radius:17px;padding:15px;margin-bottom:18px}
label{display:block;color:#9b9ba5;font-size:10px;font-weight:800;letter-spacing:.12em;margin-bottom:8px}
select{width:100%;padding:13px;border-radius:12px;border:1px solid #38383f;background:#0f0f12;color:#fff;font-size:16px;font-weight:700}
.hidden{display:none}.datebar{display:flex;justify-content:space-between;align-items:center;background:#151518;border:1px solid #2b2b31;border-radius:15px;padding:12px 14px;margin-bottom:18px}.saved{color:#8fd19e;font-size:11px;font-weight:700}
.day{background:#151518;border:1px solid #2b2b31;border-radius:17px;margin:12px 0;overflow:hidden}
summary{list-style:none;padding:17px;font-weight:800;font-size:18px}.table{overflow:auto}.th,.row{display:grid;grid-template-columns:minmax(210px,1fr) 85px 95px 145px 65px;min-width:650px;align-items:center}
.th{padding:11px 10px;background:#101014;color:#9b9ba5;font-size:9px;font-weight:800;letter-spacing:.08em}.row{padding:13px 10px;border-top:1px solid #2b2b31;font-size:12px}
.name{font-size:13px;font-weight:700}.load{width:115px;padding:9px;border:1px solid #38383f;border-radius:9px;background:#0d0d10;color:#fff;font-size:13px}.video{display:inline-flex;padding:8px;border-radius:9px;background:#fff;color:#09090b;text-decoration:none;font-weight:800;font-size:10px}
.note{color:#9b9ba5;font-size:11px;margin:10px 2px 30px}
.progress{background:#151518;border:1px solid #2b2b31;border-radius:17px;padding:15px}.progress select{margin-bottom:15px}.chart{height:270px;display:flex;align-items:flex-end;gap:10px;padding:20px 8px 28px;border-top:1px solid #2b2b31;overflow-x:auto}
.barbox{min-width:48px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px}.bar{width:28px;background:#fff;border-radius:7px 7px 2px 2px;min-height:3px}.barval{font-size:10px;color:#ddd}.bardate{font-size:9px;color:#777;white-space:nowrap;transform:rotate(-35deg);transform-origin:top center;margin-top:5px}.empty{color:#9b9ba5;text-align:center;padding:50px 10px}
.records{margin-top:14px}.record{display:flex;justify-content:space-between;border-top:1px solid #2b2b31;padding:10px 0;font-size:12px}.record span{color:#9b9ba5}
@media(max-width:700px){.tabs .tab{font-size:12px;padding:10px}.th,.row{grid-template-columns:minmax(185px,1fr) 65px 72px 115px 60px;min-width:600px}.load{width:95px}}
</style></head>
<body><header><div class="eyebrow">PERSONAL WORKOUT</div><h1>Riccardo</h1></header><main>
<section class="hero"><div class="eyebrow">SCHEDA ATTIVA</div><h2>Allenamento</h2><p>Registra il carico per ogni esercizio e controlla i tuoi progressi nel tempo.</p></section>
<div class="tabs"><button id="tabWorkout" class="tab active">🏋️ Allenamento</button><button id="tabProgress" class="tab">📈 Progressi</button></div>
<div id="workoutView"><section class="selector"><label>GIORNO DI ALLENAMENTO</label><select id="day"><option value="">Seleziona un giorno…</option><option value="0">Giorno 1</option><option value="1">Giorno 2</option><option value="2">Giorno 3</option><option value="3">Giorno 4</option></select></section>
<section id="datebar" class="datebar hidden"><div><div class="eyebrow">DATA SESSIONE</div><strong id="today"></strong></div><div id="saved" class="saved">Salvataggio automatico</div></section><section id="panel"></section></div>
<div id="progressView" class="progressView hidden"><section class="progress"><div class="eyebrow">STORICO CARICHI</div><h2 style="margin:5px 0 14px">Progressi</h2><select id="progressExercise"></select><div id="chart" class="chart"></div><div id="records" class="records"></div></section></div>
</main><script>const WORKOUTS=[{"day": "GIORNO 1", "exercises": [{"name": "Panca inclinata 30 bilanciere", "sets": "4x8", "rest": "1’30’’/2’", "video": "https://vm.tiktok.com/ZGdQmw1Ex/"}, {"name": "Military press bilanciere", "sets": "4x8", "rest": "1’30’’/2’", "video": "https://vm.tiktok.com/ZGdQmve6p/"}, {"name": "Distensioni manubri panca piana", "sets": "4x10", "rest": "1’30’’", "video": "https://vm.tiktok.com/ZGdQm3fWo/"}, {"name": "Alzate laterali singole al cavo", "sets": "4x8", "rest": "1’30’’", "video": "https://vm.tiktok.com/ZGdQm7xu2/"}, {"name": "Chest press", "sets": "4x10", "rest": "1’30’’", "video": "https://vm.tiktok.com/ZGdQm7nSA/"}, {"name": "Shoulder press", "sets": "4x10", "rest": "1’30’’", "video": "https://vm.tiktok.com/ZGdQmno3r/"}, {"name": "Croci ai cavi alti", "sets": "3xmax", "rest": "1’30’’", "video": "https://vm.tiktok.com/ZGdQmTXda/"}, {"name": "Push up", "sets": "3x12", "rest": "1’30’’", "video": "https://vm.tiktok.com/ZGdQms2sN/"}]}, {"day": "GIORNO 2", "exercises": [{"name": "Lat machine", "sets": "4x10", "rest": "1’30’’", "video": "https://vm.tiktok.com/ZGdQmorHu/"}, {"name": "Pulley barra larga", "sets": "3x8", "rest": "1’30’’", "video": "https://vm.tiktok.com/ZGdQm75H5/"}, {"name": "Rowing machine braccio singolo", "sets": "3x8", "rest": "1’30’’", "video": "https://vm.tiktok.com/ZGdQm3ejY/"}, {"name": "Pulley triangolo", "sets": "3x10", "rest": "1’30’’", "video": "https://vm.tiktok.com/ZGdQmthQd/"}, {"name": "Pull up", "sets": "4x4", "rest": "1’30’’", "video": "https://vm.tiktok.com/ZGdQmTVXx/"}, {"name": "Raise alla sbarra", "sets": "3x12", "rest": "1’", "video": "https://vm.tiktok.com/ZGdQmwXUq/"}]}, {"day": "GIORNO 3", "exercises": [{"name": "Curl alternato in piedi", "sets": "4x8", "rest": "1’30’’", "video": "https://vm.tiktok.com/ZGdQuet9w/"}, {"name": "French press seduto braccio singolo", "sets": "4x8", "rest": "1’", "video": "https://vm.tiktok.com/ZGdQuNFuB/"}, {"name": "Curl bicipiti cavo basso corda", "sets": "4x10", "rest": "1’30’’", "video": "https://vm.tiktok.com/ZGdQu2UyY/"}, {"name": "Push down barra dritta", "sets": "4x10/12", "rest": "1’30’’", "video": "https://vm.tiktok.com/ZGdQm3LN3/"}, {"name": "Panca scott", "sets": "4x10", "rest": "1’30’’", "video": "https://vm.tiktok.com/ZGdQu1Ryo/"}, {"name": "Push down corda", "sets": "4x10", "rest": "1’/1’30’’", "video": "https://vm.tiktok.com/ZGdQmGL1Y/"}, {"name": "Push up", "sets": "3x12", "rest": "1’30’’", "video": "https://vm.tiktok.com/ZGdQudL9g/"}]}, {"day": "GIORNO 4", "exercises": [{"name": "Alzate laterali", "sets": "4x10", "rest": "1’30’’", "video": "https://vm.tiktok.com/ZGdQuLxBD/"}, {"name": "Front lever tuck", "sets": "4x4’’", "rest": "1’30’’", "video": "https://vm.tiktok.com/ZGdQmshJQ/"}, {"name": "Croci ai cavi bassi", "sets": "3x12", "rest": "1’30’’", "video": "https://vm.tiktok.com/ZGdQu2dF4/"}, {"name": "Pull up", "sets": "4x4", "rest": "1’30’’", "video": "https://vm.tiktok.com/ZGdQmEWjF/"}, {"name": "Raise alla sbarra", "sets": "3x12", "rest": "1’", "video": "https://vm.tiktok.com/ZGdQu2uke/"}, {"name": "Crunch", "sets": "3x20", "rest": "1’", "video": "https://vm.tiktok.com/ZGdQmGRHk/"}]}];
const workouts=WORKOUTS, KEY='riccardo_workout_history_v3';
const day=document.getElementById('day'), panel=document.getElementById('panel'), datebar=document.getElementById('datebar'), today=document.getElementById('today'), saved=document.getElementById('saved');
const tabWorkout=document.getElementById('tabWorkout'), tabProgress=document.getElementById('tabProgress'), workoutView=document.getElementById('workoutView'), progressView=document.getElementById('progressView');
const progressExercise=document.getElementById('progressExercise'), chart=document.getElementById('chart'), records=document.getElementById('records');
const db=()=>JSON.parse(localStorage.getItem(KEY)||'[]'); const save=x=>localStorage.setItem(KEY,JSON.stringify(x));
const iso=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const it=d=>{const p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0]};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function renderWorkout(i){
 if(i===''){panel.innerHTML='';datebar.classList.add('hidden');return}
 const idx=+i,w=workouts[idx],date=iso();
 datebar.classList.remove('hidden');today.textContent=it(date);
 const old=db().find(x=>x.date===date&&x.day===idx);
 panel.innerHTML='<div class="day"><summary>'+esc(w.day)+'</summary><div class="table"><div class="th"><div>ESERCIZIO</div><div>SERIE × REP</div><div>RECUPERO</div><div>CARICO (kg)</div><div>VIDEO</div></div>'+
 w.exercises.map((e,j)=>{const val=old?.loads?.[j]??'';return '<div class="row"><div class="name">'+esc(e.name)+'</div><div>'+esc(e.sets)+'</div><div>'+esc(e.rest)+'</div><div><input class="load" inputmode="decimal" placeholder="es. 20" value="'+esc(val)+'" data-j="'+j+'"></div><div><a class="video" href="'+e.video+'" target="_blank" rel="noopener">🎥</a></div></div>'}).join('')+'</div></div><div class="note">💾 Il carico per esercizio viene salvato automaticamente con la data di oggi.</div>';
 panel.querySelectorAll('.load').forEach(inp=>inp.addEventListener('input',()=>saveLoad(idx,inp.dataset.j,inp.value)));
}
function saveLoad(dayIdx,j,value){
 const date=iso(), all=db(); let r=all.find(x=>x.date===date&&x.day===dayIdx);
 if(!r){r={date,day:dayIdx,loads:{}};all.push(r)}
 r.loads[j]=value; save(all);
 saved.textContent='✓ Salvato'; setTimeout(()=>saved.textContent='Salvataggio automatico',900); renderProgressOptions();
}
function allExercises(){
 return workouts.flatMap((w,wi)=>w.exercises.map((e,ei)=>({key:wi+'_'+ei,name:e.name,wi,ei})));
}
function renderProgressOptions(){
 progressExercise.innerHTML=allExercises().map(e=>'<option value="'+e.key+'">'+esc(e.name)+'</option>').join('');
 renderProgress();
}
function renderProgress(){
 const [wi,ei]=progressExercise.value.split('_').map(Number), name=workouts[wi]?.exercises[ei]?.name;
 const pts=db().filter(r=>r.day===wi&&r.loads&&r.loads[ei]!==undefined&&String(r.loads[ei]).trim()!=='').map(r=>({date:r.date,value:parseFloat(String(r.loads[ei]).replace(',','.'))})).filter(x=>Number.isFinite(x.value)).sort((a,b)=>a.date.localeCompare(b.date));
 if(!pts.length){chart.innerHTML='<div class="empty">Nessun carico salvato per questo esercizio.</div>';records.innerHTML='';return}
 const max=Math.max(...pts.map(p=>p.value),1);
 chart.innerHTML=pts.map(p=>'<div class="barbox"><div class="barval">'+p.value+' kg</div><div class="bar" style="height:'+Math.max(3,(p.value/max)*175)+'px"></div><div class="bardate">'+it(p.date)+'</div></div>').join('');
 records.innerHTML=pts.slice().reverse().map(p=>'<div class="record"><strong>'+it(p.date)+'</strong><span>'+p.value+' kg</span></div>').join('');
}
function showWorkout(){tabWorkout.classList.add('active');tabProgress.classList.remove('active');workoutView.classList.remove('hidden');progressView.classList.add('hidden')}
function showProgress(){tabProgress.classList.add('active');tabWorkout.classList.remove('active');workoutView.classList.add('hidden');progressView.classList.remove('hidden');renderProgressOptions()}
day.addEventListener('change',()=>renderWorkout(day.value)); tabWorkout.onclick=showWorkout; tabProgress.onclick=showProgress; progressExercise.onchange=renderProgress;
renderWorkout(''); 
</script></body></html>
