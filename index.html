.guided-timer{text-align:center;padding:25px 12px 22px;border-radius:26px;background:#fff;border:1px solid var(--line);box-shadow:0 12px 35px rgba(0,0,0,.05);margin:12px 0;transition:background .45s var(--ease-apple),border-color .45s var(--ease-apple),box-shadow .45s var(--ease-apple),transform .25s var(--ease-apple)}.guided-timer.live{animation:timerBreathe 2.8s ease-in-out infinite}.guided-time{font-variant-numeric:tabular-nums;font-size:clamp(58px,16vw,92px);font-weight:850;letter-spacing:-.07em;line-height:.95;transition:color .35s var(--ease-apple);transform-origin:center}.guided-time.tick{animation:timerTick .22s var(--ease-apple)}.guided-timer small{display:block;margin-top:10px;color:var(--muted);font-weight:750}.guided-timer.extended{background:#fbfff1;border-color:rgba(180,190,70,.30);box-shadow:0 14px 38px rgba(180,190,70,.10)}.guided-timer.extended .guided-time{color:#7f8500}.guided-timer.overtime{background:#fff0ef;border-color:rgba(255,59,48,.22)}.guided-timer.overtime .guided-time{color:#ff3b30}.guided-extra{display:none;margin-top:7px;color:#ff3b30;font-size:13px;font-weight:800}.guided-timer.overtime .guided-extra{display:block}
.guided-actions{display:grid;grid-template-columns:1fr;gap:9px;margin-top:12px}.guided-actions button{min-height:52px;border-radius:17px;font-weight:850;font-size:15px}.guided-primary{background:#111;color:#fff}.guided-secondary{background:#e9ebef;color:#111}.guided-danger{background:#fff0ef;color:#ff3b30}.guided-load{display:none;margin-top:14px;padding:17px;border-radius:22px;background:#fff;border:1px solid var(--line)}.guided-load.show{display:block;animation:pop .3s var(--ease-spring) both}.guided-load label{display:block;font-size:12px;font-weight:850;color:#555;margin-bottom:7px}.guided-load .input{font-size:18px}.guided-note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.4}.guided-memory{margin:12px 0;padding:14px 15px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:0 10px 28px rgba(0,0,0,.04);font-size:13px;line-height:1.45}.guided-memory-kicker{font-size:10px;font-weight:850;letter-spacing:.08em;color:var(--muted);margin-bottom:5px}
.guided-next{display:none;text-align:center;padding:28px 10px}.guided-next.show{display:block;animation:fadeUp .35s var(--ease-apple) both}.guided-next .check{width:62px;height:62px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;margin:0 auto 15px;font-size:26px;animation:pop .45s var(--ease-spring) both}.guided-next h3{font-size:24px;letter-spacing:-.04em;margin:0 0 7px}.guided-next p{color:var(--muted);margin:0;line-height:1.45}
.guided-badge{display:inline-flex;padding:7px 10px;border-radius:999px;background:rgba(0,122,255,.1);color:#006fe6;font-size:11px;font-weight:850}.guided-finish{display:none;text-align:center;padding:28px 10px}.guided-finish.show{display:block;animation:fadeUp .35s var(--ease-apple) both}.guided-finish .check{width:70px;height:70px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;margin:0 auto 15px;font-size:30px}.guided-finish h3{font-size:28px;letter-spacing:-.05em;margin:0 0 8px}.guided-finish p{color:var(--muted);line-height:1.5;margin:0}
@keyframes guidedFade{from{opacity:0}to{opacity:1}}@keyframes guidedUp{from{opacity:0;transform:translateY(30px) scale(.98)}to{opacity:1;transform:none}}@keyframes timerTick{0%{transform:scale(1)}45%{transform:scale(1.035)}100%{transform:scale(1)}}@keyframes timerBreathe{0%,100%{box-shadow:0 12px 35px rgba(0,0,0,.05)}50%{box-shadow:0 16px 42px rgba(0,0,0,.075)}}@keyframes progressPulse{0%{transform:scaleX(.98)}60%{transform:scaleX(1.015)}100%{transform:scaleX(1)}}
@media(prefers-reduced-motion:reduce){.guided-timer.live,.guided-time.tick,.guided-progress span.pulse,.guided-sheet.guided-content-in{animation:none!important;transition:none!important}}
@media(max-width:500px){.guided-overlay{padding:0}.guided-sheet{border-radius:30px 30px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:96dvh}.guided-time{font-size:72px}}
.login{min-height:100dvh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% 0,#fff 0,#f4f4f6 48%,#e8ebf0 100%)}.login-box{width:min(440px,100%);padding:30px;background:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.9);backdrop-filter:blur(30px);border-radius:34px;box-shadow:0 25px 80px rgba(0,0,0,.12)}.login-logo{width:60px;height:60px;border-radius:19px;background:#111;color:#fff;display:grid;place-items:center;font-size:24px;font-weight:900;margin-bottom:24px}.login h1{font-size:36px;letter-spacing:-.05em;margin:0 0 8px}.login p{color:var(--muted);line-height:1.5}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#eef0f4;border-radius:15px;padding:4px;margin:22px 0 14px}.tabs button{background:transparent;padding:10px;border-radius:11px;font-weight:800;color:var(--muted)}.tabs button.active{background:#fff;color:#111;box-shadow:0 3px 10px rgba(0,0,0,.07)}.field{margin:11px 0}.field label{display:block;font-size:12px;font-weight:800;margin:0 0 7px;color:#555}.full{width:100%;margin-top:10px}.error{color:#ff3b30;font-size:13px;line-height:1.4;margin-top:10px}.success{color:#248a3d;font-size:13px;line-height:1.4;margin-top:10px}
.modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,.28);backdrop-filter:blur(10px);z-index:50;display:none;align-items:flex-end;justify-content:center}.modal-wrap.show{display:flex}.sheet{width:min(760px,100%);background:#fff;border-radius:30px 30px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px rgba(0,0,0,.18);max-height:88dvh;overflow:auto}.grab{width:40px;height:5px;border-radius:99px;background:#d7d7dc;margin:0 auto 18px}.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.close{width:38px;height:38px;border-radius:50%;background:#eef0f4}.toast{position:fixed;z-index:80;left:50%;bottom:100px;transform:translate(-50%,20px);background:#111;color:#fff;padding:12px 16px;border-radius:999px;font-size:13px;font-weight:750;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 12px 35px rgba(0,0,0,.2)}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){.shell{padding:16px 14px calc(160px + env(safe-area-inset-bottom))}.grid{grid-template-columns:1fr}.day-grid{grid-template-columns:1fr 1fr}.exercise{grid-template-columns:minmax(0,1fr) 112px 34px}.topbar{padding-top:8px}.card{padding:18px}.hero h1{font-size:42px}.exercise-menu{right:0}}
@media(prefers-reduced-motion:reduce){.guided-timer.live,.guided-time.tick,.guided-progress span.pulse,.guided-sheet.guided-content-in{animation:none!important;transition:none!important}}

/* ===== Apple-like motion system ===== */
:root{
  --ease-apple:cubic-bezier(.22,.61,.36,1);
  --ease-spring:cubic-bezier(.18,.89,.32,1.28);
}
body{overflow-x:hidden}
#app{min-height:100dvh}
#app.page-enter{animation:pageIn .52s var(--ease-apple) both}
#app.page-enter-up{animation:pageInUp .52s var(--ease-apple) both}
#app.page-exit{animation:pageOut .22s ease both}
@keyframes pageIn{
  from{opacity:0;transform:translateX(18px) scale(.985);filter:blur(7px)}
  to{opacity:1;transform:none;filter:none}
}
@keyframes pageInUp{
  from{opacity:0;transform:translateY(18px) scale(.985);filter:blur(7px)}
  to{opacity:1;transform:none;filter:none}
}
@keyframes pageOut{
  from{opacity:1;transform:none}
  to{opacity:0;transform:translateX(-12px) scale(.992);filter:blur(4px)}
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:none}
}
@keyframes pop{
  0%{transform:scale(.94);opacity:0}
  70%{transform:scale(1.015)}
  100%{transform:scale(1);opacity:1}
}
@keyframes pulseGlow{
  0%,100%{box-shadow:0 0 0 0 rgba(0,122,255,0)}
  50%{box-shadow:0 0 0 7px rgba(0,122,255,.08)}
}
.hero,.card,.day-card,.stat,.history-item,.exercise{
  animation:fadeUp .52s var(--ease-apple) both;
}
.grid>.card:nth-child(2){animation-delay:.06s}
.day-card:nth-child(2),.stat:nth-child(2){animation-delay:.045s}
.day-card:nth-child(3),.stat:nth-child(3){animation-delay:.09s}
.day-card:nth-child(4){animation-delay:.135s}
.exercise:nth-child(2){animation-delay:.025s}
.exercise:nth-child(3){animation-delay:.05s}
.exercise:nth-child(4){animation-delay:.075s}
.exercise:nth-child(5){animation-delay:.1s}
.exercise:nth-child(6){animation-delay:.125s}
.exercise:nth-child(7){animation-delay:.15s}
.exercise:nth-child(8){animation-delay:.175s}
.day-card,.stat,.video,.primary,.secondary,.nav button,.icon-btn,.avatar,.close{
  transition:transform .25s var(--ease-spring),box-shadow .25s ease,background-color .2s ease,opacity .2s ease;
}
.day-card:active,.primary:active,.secondary:active,.video:active,.nav button:active,.icon-btn:active,.avatar:active,.close:active{
  transform:scale(.95);
}
.day-card:hover{box-shadow:0 14px 34px rgba(0,0,0,.08)}
.primary:hover{box-shadow:0 10px 26px rgba(0,0,0,.16);transform:translateY(-1px)}
.video:hover,.secondary:hover,.icon-btn:hover{transform:translateY(-1px)}
.nav button.active{animation:pop .34s var(--ease-spring) both}
.nav button.active .ico{animation:pop .38s var(--ease-spring) both}
.input{transition:border-color .2s ease,box-shadow .25s ease,transform .2s ease}
.input:focus{transform:translateY(-1px)}
.save-pulse{animation:pulseGlow .8s ease}
.toast.show{animation:toastIn .38s var(--ease-spring) both}
@keyframes toastIn{
  from{opacity:0;transform:translate(-50%,18px) scale(.94)}
  to{opacity:1;transform:translate(-50%,0) scale(1)}
}
.modal-wrap{opacity:0;transition:opacity .28s ease}
.modal-wrap.show{opacity:1}
.sheet{transform:translateY(105%);transition:transform .48s var(--ease-apple)}
.modal-wrap.show .sheet{transform:none}
.modal-wrap.closing .sheet{transform:translateY(105%)}
.modal-wrap.closing{opacity:0}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}

<style>
/* ===== Responsive layout hardening ===== */
html,body{width:100%;max-width:100%;min-width:0;overflow-x:hidden}
*,*::before,*::after{min-width:0}
#app,.shell,.view,.grid,.card,.day-grid,.day-card,.exercise,.toolbar{max-width:100%;min-width:0}
.shell{width:100%;margin-inline:auto}
.grid{width:100%}
.card{overflow:hidden}
.day-card{overflow:hidden}
.day-card p{overflow-wrap:anywhere}
.select,.input{max-width:100%;min-width:0}
.nav{width:calc(100% - 28px);max-width:560px}
img,video,iframe,svg{max-width:100%}
@media(max-width:760px){
  .shell{width:100%;padding-left:14px;padding-right:14px}
  .grid{grid-template-columns:minmax(0,1fr)}
  .day-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{width:100%;padding:18px}
  .hero{width:100%}
  .toolbar{flex-wrap:wrap}
}
@media(max-width:500px){
  .shell{padding-left:12px;padding-right:12px;padding-bottom:calc(160px + env(safe-area-inset-bottom))}
  .day-grid{grid-template-columns:minmax(0,1fr)}
  .day-card{width:100%}
  .stat-row{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stat{padding:12px 9px}
  .stat b{font-size:21px}
  .stat span{font-size:9px;letter-spacing:-.01em}
  .nav{width:calc(100% - 24px);left:50%;right:auto}
  .topbar{width:100%}
}
</style>
</head>

<div id="app"></div><div id="nav-root"></div><div id="modal" class="modal-wrap"></div><div id="guided-root"></div><div id="toast" class="toast"></div>

function parseSets(scheme){const m=String(scheme).match(/^(\d+)x/);return m?Number(m[1]):1}
function parseRestValue(value){
 const s=String(value).trim().replace(/\s+/g,"");
 const secMatch=s.match(/^(\d+)[’'](\d{1,2})(?:[”’"]*)$/); if(secMatch)return Number(secMatch[1])*60+Number(secMatch[2]);
 const minMatch=s.match(/^(\d+)(?:[’']+|m(?:in)?(?:uti)?)$/i); if(minMatch)return Number(minMatch[1])*60;
 const secOnly=s.match(/^(\d+)s(?:ec)?$/i); if(secOnly)return Number(secOnly[1]);
 const n=Number(s.replace(/[^0-9]/g,"")); return Number.isFinite(n)&&n>0?n*60:60;
}
function parseRestRange(rest){
  const parts=String(rest).split(/\s*\/\s*/);
  if(!parts.length)return {min:60,max:60};
  const min=parseRestValue(parts[0]);
  const max=parts[1]?parseRestValue(parts[1]):min;
  return {min,max:Math.max(min,max)};
}

function guidedFormat(sec){sec=Math.max(0,Math.floor(sec));const m=Math.floor(sec/60),s=sec%60;return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`}

function guidedStartRest(rest,phase){
 const g=state.guided;if(!g)return;guidedClearTimer();
 const range=typeof rest==='number'?{min:rest,max:rest}:rest;
 g.phase=phase;g.restMin=range.min;g.restMax=Math.max(range.min,range.max);g.remaining=range.min;g.overtime=0;g.extended=false;
 g.startedAt=Date.now();g.endsAt=g.startedAt+range.min*1000;
 g.interval=setInterval(guidedTick,200);renderGuided();
}
function guidedTick(){
 const g=state.guided;if(!g||!g.startedAt)return;
 const elapsed=(Date.now()-g.startedAt)/1000;
 if(elapsed<g.restMin){g.remaining=Math.max(0,Math.ceil(g.restMin-elapsed));g.overtime=0;g.extended=false;}
 else if(elapsed<g.restMax){g.remaining=Math.min(g.restMax,Math.ceil(elapsed));g.overtime=0;g.extended=true;}
 else {g.remaining=0;g.overtime=Math.max(0,Math.ceil(elapsed-g.restMax));g.extended=false;}
 updateGuidedTimer();
}
function updateGuidedTimer(){
 const g=state.guided;if(!g)return; const timer=document.querySelector(".guided-timer"),time=document.querySelector(".guided-time"),extra=document.querySelector(".guided-extra"),fill=document.querySelector(".guided-progress span"); if(!timer||!time)return;
 const overtime=g.overtime>0; timer.classList.toggle("overtime",overtime); timer.classList.toggle("extended",g.extended&&!overtime); timer.classList.toggle("live",!overtime);
 const text=overtime?`+${guidedFormat(g.overtime)}`:guidedFormat(g.remaining); if(time.textContent!==text){time.textContent=text;time.classList.remove("tick");void time.offsetWidth;time.classList.add("tick");}
 if(extra)extra.textContent=overtime?`Recupero extra: ${guidedFormat(g.overtime)}`:g.extended?`Finestra PT · massimo ${guidedFormat(g.restMax)}`:"";
 if(fill&&g.startedAt){const elapsed=(Date.now()-g.startedAt)/1000,pct=Math.min(100,(elapsed/Math.max(g.restMax,1))*100);fill.style.width=`${pct}%`;fill.classList.remove("pulse");void fill.offsetWidth;fill.classList.add("pulse");}
}

async function guidedSaveLoad(){const g=state.guided,input=document.querySelector("#guided-load-input");if(!g||!input)return;const raw=input.value.trim().replace(",",".");if(raw===""){toast("Inserisci il carico usato");return}const weight=Number(raw);if(!Number.isFinite(weight)||weight<0){toast("Inserisci un carico valido");return}const ex=guidedExercise();g.loads[ex[0]]=String(weight);const loads={...g.loads};let res;if(g.recordId){res=await sb.from("workout_records").update({loads}).eq("id",g.recordId).eq("user_id",state.user.id).select().single()}else{res=await sb.from("workout_records").insert({user_id:state.user.id,date:today(),day:g.day,loads}).select().single();if(!res.error)g.recordId=res.data.id}if(res.error){console.error(res.error);toast("Errore nel salvataggio automatico");return}await loadData();const next=guidedNextExercise();if(next){guidedStartRest(180,"exercise-rest")}else{g.phase="done";renderGuided();toast("Allenamento completato")}}
function guidedFinishRest(){const g=state.guided;if(!g)return;guidedClearTimer();if(g.phase==="set-rest"){g.setIndex++;g.phase="ready";g.remaining=0;g.overtime=0;g.extended=false;renderGuided();return}if(g.phase==="exercise-rest"){g.exIndex++;g.setIndex=1;g.phase="ready";g.remaining=0;g.overtime=0;g.extended=false;renderGuided()}}

function guidedProgress(){
 const g=state.guided;if(!g)return 0;
 const items=DAYS[g.day].items;
 let done=0;
 for(let i=0;i<g.exIndex;i++) done+=parseSets(items[i][2]);
 done+=Math.max(0,Math.min(g.setIndex-1,parseSets(items[g.exIndex][2])));
 const total=items.reduce((sum,i)=>sum+parseSets(i[2]),0);
 return total?Math.min(100,(done/total)*100):0;
}
function renderGuided(){

 const ex=guidedExercise();if(!ex){guidedClose();return}
 const totalSets=parseSets(ex[2]),next=guidedNextExercise(),progress=guidedProgress();let body="";
 const inExerciseRest=g.phase==="exercise-rest";

 const sub=inExerciseRest?(next?`Preparati per ${next[1]}`:"Hai terminato tutti gli esercizi"):`${esc(ex[2])} · recupero ${esc(ex[3])}`;
 if(g.phase==="ready"){const rn=rememberedNote(ex[0]);body=`<div class="guided-timer"><div class="guided-time">${guidedFormat(0)}</div><small>Pronto per la serie ${g.setIndex} di ${totalSets}</small></div>${rn?`<div class="guided-memory"><div class="guided-memory-kicker">NOTA DA RICORDARE</div><div>${esc(rn.note)}</div></div>`:""}<div class="guided-actions"><a class="guided-secondary" style="display:grid;place-items:center;text-decoration:none" href="${ex[4]}" target="_blank" rel="noopener">Guarda il video ↗</a><button class="guided-primary" data-guided="finish-set">Ho finito la serie</button><button class="guided-secondary" data-guided="close">Esci dall’allenamento</button></div>`}
 else if(g.phase==="load"){body=`<div class="guided-timer"><div class="guided-time">✓</div><small>Tutte le ${totalSets} serie completate</small></div><div class="guided-load show"><label for="guided-load-input">Carico usato nell’esercizio</label><div style="display:flex;align-items:center;gap:8px"><input id="guided-load-input" class="input" inputmode="decimal" type="text" placeholder="es. 20" autocomplete="off"><strong>kg</strong></div><div class="guided-note">Un solo carico per l’intero esercizio. Verrà salvato automaticamente.</div></div><div class="guided-actions"><button class="guided-primary" data-guided="save-load">Salva e continua</button></div>`}
 else if(g.phase==="set-rest"||g.phase==="exercise-rest"){
   const range=`${guidedFormat(g.restMin)}${g.restMax>g.restMin?` → ${guidedFormat(g.restMax)}`:""}`;
   const label=g.phase==="set-rest"?`Recupero tra le serie · ${range}`:`Recupero tra gli esercizi · 03:00`;
   body=`<div class="guided-timer live"><div class="guided-time">${guidedFormat(g.remaining)}</div><small>${label}</small><div class="guided-extra"></div></div><div class="guided-actions"><button class="guided-primary" data-guided="rest-done">${g.phase==="set-rest"?"Fine recupero → prossima serie":(next?`Inizia ${esc(next[1])}`:"Fine allenamento")}</button><button class="guided-secondary" data-guided="close">Esci dall’allenamento</button></div>`
 }
 else {body=`<div class="guided-finish show"><div class="check">✓</div><h3>Allenamento completato.</h3><p>Hai completato tutti gli esercizi del Giorno ${g.day}. I carichi sono già stati salvati.</p></div><div class="guided-actions"><button class="guided-primary" data-guided="close-finish">Chiudi</button></div>`}

function progressView(){
 const exs=allExercises(),selected=exs.find(x=>x.id===state.chartId)||exs[0],points=[];
 state.records.slice().reverse().forEach(r=>{const x=recordLoads(r)[selected.id];if(x?.weight!==undefined&&x.weight!=="")points.push({date:r.date,w:+x.weight})});
 let max=Math.max(1,...points.map(p=>p.w)),min=Math.min(0,...points.map(p=>p.w)),W=900,H=260,pad=35;

 <div class="chart-labels"><span>${points[0]?dateIT(points[0].date):""}</span><strong>${points.length?max+" kg":"—"}</strong><span>${points.at(-1)?dateIT(points.at(-1).date):""}</span></div></div>
 ${exerciseNotes(selected.id).length?`<div class="card notes-progress" style="margin-top:18px"><div class="workout-head"><div><div class="eyebrow">NOTE</div><h2>Appunti su questo esercizio</h2></div><span class="pill">${exerciseNotes(selected.id).length}</span></div>${exerciseNotes(selected.id).map(n=>`<div class="progress-note"><div><strong>${dateIT(n.date)}</strong>${n.remember?`<span class="note-badge">Da ricordare</span>`:""}</div><p>${esc(n.note)}</p></div>`).join("")}</div>`:""}
 <div class="card" style="margin-top:18px"><div class="workout-head"><div><div class="eyebrow">CRONOLOGIA</div><h2>Allenamenti salvati</h2></div></div>${state.records.length?state.records.map(r=>`<div class="history-item"><div><strong>Giorno ${r.day} · ${DAYS[r.day]?.name||""}</strong><small>${dateIT(r.date)} · ${Object.values(recordLoads(r)).filter(x=>x?.weight!=="").length} esercizi registrati</small></div><div class="history-actions"><button class="icon-btn" data-edit="${r.id}" title="Modifica">✎</button><button class="icon-btn" data-delete="${r.id}" title="Elimina">⌫</button></div></div>`).join(""):`<div class="empty">La cronologia è vuota.</div>`}</div>`;
}
function renderAuth(){
 const login=state.authMode==="login";
 const app=document.getElementById("app");
 app.classList.remove("page-enter","page-enter-up","page-exit");
 void app.offsetWidth;
 app.classList.add("page-enter-up");
 document.getElementById("nav-root").innerHTML="";
 app.innerHTML=`<main class="login"><section class="login-box"><div class="login-logo">R</div><div class="eyebrow">PERSONAL WORKOUT</div><h1>Il tuo allenamento.</h1><p>Il tuo spazio personale per allenarti, registrare i carichi e seguire i progressi.</p><div class="tabs"><button data-auth="login" class="${login?"active":""}">Accedi</button><button data-auth="signup" class="${!login?"active":""}">Crea account</button></div>
 <form id="auth-form"><div class="field"><label>Email</label><input class="input" type="email" name="email" required autocomplete="email" placeholder="nome@email.com"></div><div class="field"><label>Password</label><input class="input" type="password" name="password" required minlength="6" autocomplete="${login?"current-password":"new-password"}" placeholder="Almeno 6 caratteri"></div>${!login?`<div class="field"><label>Nome</label><input class="input" name="name" required placeholder="Riccardo"></div>`:""}<button class="primary full" type="submit">${login?"Accedi":"Crea account"}</button><div id="auth-msg"></div></form></section></main>`;
}
async function loadData(){
 const {data,error}=await sb.from("workout_records").select("*").eq("user_id",state.user.id).order("date",{ascending:false}).order("created_at",{ascending:false});
 if(error){console.error(error);toast("Non riesco a caricare i dati");return}state.records=data||[];
}
async function saveWorkout(){
 const saveBtn=document.querySelector('[data-action="save"]');
 if(saveBtn){saveBtn.classList.add("save-pulse");saveBtn.textContent="Salvataggio…";saveBtn.disabled=true;}
 const loads={};document.querySelectorAll("[data-exercise-row]").forEach(row=>{const id=row.dataset.exerciseRow,load=row.querySelector("[data-load]"),note=row.querySelector("[data-note]"),remember=row.querySelector("[data-remember]");const weight=load?.value.trim()||"",noteText=note?.value.trim()||"";if(weight!==""||noteText!=="")loads[id]={...(weight!==""?{weight}:{}),...(noteText!==""?{note:noteText}:{}),...(noteText&&remember?.checked?{remember:true}:{})}});
 if(!Object.keys(loads).length){
  if(saveBtn){saveBtn.classList.remove("save-pulse");saveBtn.textContent="Salva allenamento";saveBtn.disabled=false}
  toast("Inserisci almeno un carico o una nota");return
}
 const payload={user_id:state.user.id,date:state.editing?.date||today(),day:+state.day,loads};
 const res=state.editing?.id?await sb.from("workout_records").update(payload).eq("id",state.editing.id).eq("user_id",state.user.id).select().single():await sb.from("workout_records").insert(payload).select().single();
 if(res.error){
  console.error(res.error);
  if(saveBtn){saveBtn.classList.remove("save-pulse");saveBtn.textContent="Salva allenamento";saveBtn.disabled=false}
  toast("Errore nel salvataggio");return
}
 state.editing=null;await loadData();toast("Allenamento salvato");state.view="progress";render();
}
async function editRecord(id){const r=state.records.find(x=>String(x.id)===String(id));if(!r)return;state.day=+r.day;state.editing={id:r.id,date:r.date,loads:recordLoads(r)};state.view="workout";render();window.scrollTo({top:0,behavior:"smooth"})}
async function deleteRecord(id){if(!confirm("Eliminare questo allenamento?"))return;const {error}=await sb.from("workout_records").delete().eq("id",id).eq("user_id",state.user.id);if(error){toast("Errore nell’eliminazione");return}await loadData();toast("Allenamento eliminato");render()}
function showProfile(){
 const modal=document.getElementById("modal");
 modal.classList.remove("closing");
 modal.innerHTML=`<div class="sheet"><div class="grab"></div><div class="sheet-head"><div><div class="eyebrow">ACCOUNT</div><h2 style="margin:4px 0">Profilo</h2></div><button class="close" data-close>×</button></div><div style="margin:22px 0;padding:18px;border-radius:20px;background:#f4f4f6"><strong>${esc(state.profile?.full_name||firstName())}</strong><div class="muted" style="margin-top:5px">${esc(state.user.email)}</div></div><button class="primary" style="width:100%" data-logout>Esci dall’account</button></div>`;modal.classList.add("show")}
document.addEventListener("click",async e=>{
 const gs=e.target.closest("[data-guided-start]");if(gs){guidedStart(gs.dataset.guidedStart);return}
 const ga=e.target.closest("[data-guided]")?.dataset.guided;
 if(ga==="close"||ga==="close-finish"){guidedClose();return}
 if(ga==="finish-set"){const ex=guidedExercise();const totalSets=parseSets(ex[2]);if(state.guided.setIndex<totalSets){guidedStartRest(parseRestRange(ex[3]),"set-rest")}else{guidedLoadPrompt()}return}
 if(ga==="save-load"){await guidedSaveLoad();return}
 if(ga==="rest-done"){guidedFinishRest();return}
 if(!e.target.closest(".exercise-menu")&&!e.target.closest("[data-note-toggle]")){document.querySelectorAll(".exercise-menu.show").forEach(m=>m.classList.remove("show"));document.querySelectorAll("[data-note-toggle].open").forEach(b=>b.classList.remove("open"));}
 const closeExerciseMenus=()=>{document.querySelectorAll(".exercise-menu.show").forEach(m=>m.classList.remove("show"));document.querySelectorAll("[data-note-toggle].open").forEach(b=>b.classList.remove("open"));};
 const placeExerciseMenu=(menu,button)=>{
   if(!menu||!button)return;
   menu.classList.add("show");
   const br=button.getBoundingClientRect(),gap=10,pad=12,mr=menu.getBoundingClientRect();
   let left=br.right+gap;
   if(left+mr.width>window.innerWidth-pad) left=br.left-gap-mr.width;
   if(left<pad) left=pad;
   let top=br.top+(br.height/2)-(mr.height/2);
   if(top<pad) top=pad;
   if(top+mr.height>window.innerHeight-pad) top=window.innerHeight-pad-mr.height;
   menu.style.left=Math.round(left)+"px";
   menu.style.top=Math.round(top)+"px";
 };
 const noteToggle=e.target.closest("[data-note-toggle]");
 if(noteToggle){const id=noteToggle.dataset.noteToggle;const menu=document.querySelector(`[data-note-menu="${id}"]`);const wasOpen=menu?.classList.contains("show");closeExerciseMenus();if(menu&&!wasOpen){noteToggle.classList.add("open");placeExerciseMenu(menu,noteToggle);}return}
 const noteClose=e.target.closest("[data-note-close]");if(noteClose){closeExerciseMenus();return}
 const important=e.target.closest("[data-nav],[data-day],[data-action='save'],[data-edit],[data-delete],[data-profile]");
 if(important && navigator.vibrate) navigator.vibrate(8);

 const nav=e.target.closest("[data-nav]");
 if(nav){
   const next=nav.dataset.nav;
   if(next!==state.view){
     const app=document.getElementById("app");
     app.classList.add("page-exit");
     setTimeout(()=>{state.view=next;state.editing=null;render();},170);
   }
   return;
 }
 const day=e.target.closest("[data-day]");
 if(day){
   const nextDay=+day.dataset.day;
   const app=document.getElementById("app");
   app.classList.add("page-exit");
   setTimeout(()=>{state.day=nextDay;state.view="workout";state.editing=null;render();},170);
   return;
 }
 const auth=e.target.closest("[data-auth]");if(auth){state.authMode=auth.dataset.auth;renderAuth();return}
 const act=e.target.closest("[data-action]")?.dataset.action;if(act==="save"){await saveWorkout();return}if(act==="clear"){document.querySelectorAll("[data-load]").forEach(i=>i.value="");document.querySelectorAll("[data-note]").forEach(i=>i.value="");document.querySelectorAll("[data-remember]").forEach(i=>i.checked=false);return}if(act==="profile"){showProfile();return}
 const ed=e.target.closest("[data-edit]");if(ed){await editRecord(ed.dataset.edit);return}
 const del=e.target.closest("[data-delete]");if(del){await deleteRecord(del.dataset.delete);return}
});
document.addEventListener("change",e=>{
 if(e.target.matches('[data-action="day-select"]')){
   const app=document.getElementById("app"); app.classList.add("page-exit");
   setTimeout(()=>{state.day=+e.target.value;state.editing=null;render();},150);
 }
 if(e.target.matches('[data-action="chart-select"]')){
   const app=document.getElementById("app"); app.classList.add("page-exit");
   setTimeout(()=>{state.chartId=e.target.value;render();},150);
 }
});
document.addEventListener("submit",async e=>{
 if(e.target.id!=="auth-form")return;e.preventDefault();const f=new FormData(e.target),email=String(f.get("email")).trim(),password=String(f.get("password")),name=String(f.get("name")||"").trim(),msg=document.getElementById("auth-msg");msg.className="";msg.textContent="";
 const redirect=window.location.origin+window.location.pathname;
 if(state.authMode==="login"){const {data,error}=await sb.auth.signInWithPassword({email,password});if(error){msg.className="error";msg.textContent=error.message;return}state.user=data.user;await loadProfile();await loadData();render();return}
 const {data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:name},emailRedirectTo:redirect}});
 if(error){msg.className="error";msg.textContent=error.message;return}
 if(data.session){state.user=data.user;await loadProfile();await loadData();render()}else{msg.className="success";msg.textContent="Controlla la tua email per confermare l’account. Dopo la conferma torna qui e accedi."}
});
async function loadProfile(){const {data}=await sb.from("profiles").select("*").eq("id",state.user.id).maybeSingle();state.profile=data||{full_name:state.user.user_metadata?.full_name||""}}
document.addEventListener("click",async e=>{if(e.target.matches("[data-close]")||e.target.id==="modal"){
 const modal=document.getElementById("modal");
 modal.classList.add("closing");
 setTimeout(()=>{modal.classList.remove("show","closing")},330);
 return
}if(e.target.matches("[data-logout]")){guidedClose();await sb.auth.signOut();state.user=null;state.profile=null;state.records=[];
const modal=document.getElementById("modal");modal.classList.add("closing");
setTimeout(()=>{modal.classList.remove("show","closing");renderAuth()},250)}});

document.addEventListener("keydown",e=>{if(!state.guided)return;if(e.key==="Escape"){guidedClose();return}if(e.key==="Enter"&&document.activeElement?.id==="guided-load-input"){e.preventDefault();guidedSaveLoad()}});
sb.auth.onAuthStateChange(async(_event,session)=>{if(session?.user){state.user=session.user;await loadProfile();await loadData();render()}else if(!state.user){renderAuth()}});
(async()=>{const {data}=await sb.auth.getSession();if(data.session){state.user=data.session.user;await loadProfile();await loadData();render()}else renderAuth()})();
</script>
</body>
</html>
