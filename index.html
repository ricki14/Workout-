<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0d">
  <title>Riccardo • Workout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">PERSONAL WORKOUT</div>
      <h1>Riccardo</h1>
    </div>
  </header>

  <main>
    <section class="hero">
      <div>
        <div class="eyebrow">SCHEDA ATTIVA</div>
        <h2>Allenamento</h2>
        <p>Seleziona un giorno per vedere esercizi, serie, recuperi e video.</p>
      </div>
      <div class="date-pill">14/09 → 18/10</div>
    </section>

    <section class="day-selector">
      <label for="daySelect">GIORNO DI ALLENAMENTO</label>
      <select id="daySelect">
        <option value="">Seleziona un giorno…</option>
        <option value="0">Giorno 1</option>
        <option value="1">Giorno 2</option>
        <option value="2">Giorno 3</option>
        <option value="3">Giorno 4</option>
      </select>
    </section>

    <section id="workoutPanel" class="hidden"></section>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-card">
      <button id="closeModal" class="close-btn" aria-label="Chiudi">×</button>
      <div class="eyebrow" id="modalDay"></div>
      <h2 id="modalTitle"></h2>
      <div id="videoWrap" class="video-wrap"></div>
      <a id="openTikTok" class="secondary-btn" target="_blank" rel="noopener">Apri il video su TikTok ↗</a>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
