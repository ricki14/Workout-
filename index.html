<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090b"><title>Riccardo Workout</title><style>
*{box-sizing:border-box}body{margin:0;background:#09090b;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header,main{max-width:900px;margin:auto;padding:0 16px}header{padding-top:25px}.eyebrow{font-size:10px;letter-spacing:.16em;color:#9b9ba5;font-weight:800}
h1{margin:5px 0;font-size:31px}.hero{padding:22px 0 18px}.hero h2{margin:5px 0;font-size:25px}.hero p{margin:0;color:#9b9ba5;line-height:1.5}
.tabs{display:flex;gap:8px;margin-bottom:18px}.tab{flex:1;border:1px solid #2b2b31;background:#151518;color:#ddd;padding:12px;border-radius:12px;font-weight:800;cursor:pointer}.tab.active{background:#fff;color:#09090b}
.selector{background:#151518;border:1px solid #2b2b31;border-radius:17px;padding:15px;margin-bottom:18px}
label{display:block;color:#9b9ba5;font-size:10px;font-weight:800;letter-spacing:.12em;margin-bottom:8px}
select{width:100%;padding:13px;border-radius:12px;border:1px solid #38383f;background:#0f0f12;color:#fff;font-size:16px;font-weight:700}
.hidden{display:none}.datebar{display:flex;justify-content:space-between;align-items:center;background:#151518;border:1px solid #2b2b31;border-radius:15px;padding:12px 14px;margin-bottom:18px}.saved{color:#8fd19e;font-size:11px;font-weight:700}
.day{background:#151518;border:1px solid #2b2b31;border-radius:17px;margin:12px 0;overflow:hidden}
summary{list-style:none;padding:17px;font-weight:800;font-size:18px}.table{overflow:auto}.th,.row{display:grid;grid-template-columns:minmax(210px,1fr) 85px 95px 145px 65px;min-width:650px;align-items:center}
.th{padding:11px 10px;background:#101014;color:#9b9ba5;font-size:9px;font-weight:800;letter-spacing:.08em}.row{padding:13px 10px;border-top:1px solid #2b2b31;font-size:12px}
.name{font-size:13px;font-weight:700}.load{width:115px;padding:9px;border:1px solid #38383f;border-radius:9px;background:#0d0d10;color:#fff;font-size:13px}.video{display:inline-flex;padding:8px;border-radius:9px;background:#fff;color:#09090b;text-decoration:none;font-weight:800;font-size:10px}
.note{color:#9b9ba5;font-size:11px;margin:10px 2px 30px}
.progress{background:#151518;border:1px solid #2b2b31;border-radius:17px;padding:15px}.progress select{margin-bottom:15px}.chart{height:270px;display:flex;align-items:flex-end;gap:10px;padding:20px 8px 28px;border-top:1px solid #2b2b31;overflow-x:auto}
.barbox{min-width:48px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px}.bar{width:28px;background:#fff;border-radius:7px 7px 2px 2px;min-height:3px}.barval{font-size:10px;color:#ddd}.bardate{font-size:9px;color:#777;white-space:nowrap;transform:rotate(-35deg);transform-origin:top center;margin-top:5px}.empty{color:#9b9ba5;text-align:center;padding:50px 10px}
.records{margin-top:14px}.record{display:flex;justify-content:space-between;border-top:1px solid #2b2b31;padding:10px 0;font-size:12px}.record span{color:#9b9ba5}
@media(max-width:700px){.tabs .tab{font-size:12px;padding:10px}.th,.row{grid-template-columns:minmax(185px,1fr) 65px 72px 115px 60px;min-width:600px}.load{width:95px}}
</style></head>
<body><header><div class="eyebrow">PERSONAL WORKOUT</div><h1>Riccardo</h1></header><main>
<section class="hero"><div class="eyebrow">SCHEDA ATTIVA</div><h2>Allenamento</h2><p>Registra il carico per ogni esercizio e controlla i tuoi progressi nel tempo.</p></section>
<div class="tabs"><button id="tabWorkout" class="tab active">🏋️ Allenamento</button><button id="tabProgress" class="tab">📈 Progressi</button></div>
<div id="workoutView"><section class="selector"><label>GIORNO DI ALLENAMENTO</label><select id="day"><option value="">Seleziona un giorno…</option><option value="0">Giorno 1</option><option value="1">Giorno 2</option><option value="2">Giorno 3</option><option value="3">Giorno 4</option></select></section>
<section id="datebar" class="datebar hidden"><div><div class="eyebrow">DATA SESSIONE</div><strong id="today"></strong></div><div id="saved" class="saved">Salvataggio automatico</div></section><section id="panel"></section></div>
<div id="progressView" class="progressView hidden"><section class="progress"><div class="eyebrow">STORICO CARICHI</div><h2 style="margin:5px 0 14px">Progressi</h2><select id="progressExercise"></select><div id="chart" class="chart"></div><div id="records" class="records"></div></section></div>
</main>
<script>
const WORKOUTS = [
  {day:1, exercises:[
    ["Panca inclinata 30° bilanciere","4x8","1’30’’/2’","https://vm.tiktok.com/ZGdQmw1Ex/"],
    ["Military press bilanciere","4x8","1’30’’/2’","https://vm.tiktok.com/ZGdQmve6p/"],
    ["Distensioni manubri panca piana","4x10","1’30’’","https://vm.tiktok.com/ZGdQm3fWo/"],
    ["Alzate laterali singole al cavo","4x8","1’30’’","https://vm.tiktok.com/ZGdQm7xu2/"],
    ["Chest press","4x10","1’30’’","https://vm.tiktok.com/ZGdQm7nSA/"],
    ["Shoulder press","4x10","1’30’’","https://vm.tiktok.com/ZGdQmno3r/"],
    ["Croci ai cavi alti","3xmax","1’30’’","https://vm.tiktok.com/ZGdQmTXda/"],
    ["Push up","3x12","1’30’’","https://vm.tiktok.com/ZGdQms2sN/"]
  ]},
  {day:2, exercises:[
    ["Lat machine","4x10","1’30’’","https://vm.tiktok.com/ZGdQmorHu/"],
    ["Pulley barra larga","3x8","1’30’’","https://vm.tiktok.com/ZGdQm75H5/"],
    ["Rowing machine braccio singolo","3x8","1’30’’","https://vm.tiktok.com/ZGdQm3ejY/"],
    ["Pulley triangolo","3x10","1’30’’","https://vm.tiktok.com/ZGdQmthQd/"],
    ["Pull up","4x4","1’30’’","https://vm.tiktok.com/ZGdQmTVXx/"],
    ["Raise alla sbarra","3x12","1’","https://vm.tiktok.com/ZGdQmwXUq/"]
  ]},
  {day:3, exercises:[
    ["Curl alternato in piedi","4x8","1’30’’","https://vm.tiktok.com/ZGdQuet9w/"],
    ["French press seduto braccio singolo","4x8","1’","https://vm.tiktok.com/ZGdQuNFuB/"],
    ["Curl bicipiti cavo basso corda","4x10","1’30’’","https://vm.tiktok.com/ZGdQu2UyY/"],
    ["Push down barra dritta","4x10/12","1’30’’","https://vm.tiktok.com/ZGdQm3LN3/"],
    ["Panca scott","4x10","1’","https://vm.tiktok.com/ZGdQu1Ryo/"],
    ["Push down corda","4x10","1’/1’30’’","https://vm.tiktok.com/ZGdQmGL1Y/"],
    ["Push up","3x12","1’30’’","https://vm.tiktok.com/ZGdQudL9g/"]
  ]},
  {day:4, exercises:[
    ["Alzate laterali","4x10","1’30’’","https://vm.tiktok.com/ZGdQuLxBD/"],
    ["Front lever tuck","4x4’’","1’30’’","https://vm.tiktok.com/ZGdQmshJQ/"],
    ["Croci ai cavi bassi","3x12","1’30’’","https://vm.tiktok.com/ZGdQu2dF4/"],
    ["Pull up","4x4","1’30’’","https://vm.tiktok.com/ZGdQmEWjF/"],
    ["Raise alla sbarra","3x12","1’","https://vm.tiktok.com/ZGdQu2uke/"],
    ["Crunch","3x20","1’","https://vm.tiktok.com/ZGdQmGRHk/"]
  ]}
];

const KEY="riccardo_workout_history_v4";
let history=JSON.parse(localStorage.getItem(KEY)||"[]");
let currentDay=1;

const $=id=>document.getElementById(id);
function today(){return new Date().toISOString().slice(0,10);}
function save(){localStorage.setItem(KEY,JSON.stringify(history));}
function fmt(d){return new Date(d+"T00:00:00").toLocaleDateString("it-IT");}
function exList(){
  return [...new Set(WORKOUTS.flatMap(w=>w.exercises.map(e=>e[0])))];
}
function renderWorkout(){
  const w=WORKOUTS.find(x=>x.day===currentDay);
  $("dayTitle").textContent=`Giorno ${currentDay}`;
  const rec=history.find(r=>r.date===today()&&r.day===currentDay);
  $("exerciseRows").innerHTML=w.exercises.map((e,i)=>{
    const val=rec?.loads?.[i] ?? "";
    return `<tr>
      <td>${e[0]}</td><td>${e[1]}</td><td>${e[2]}</td>
      <td><input class="load" type="number" min="0" step="0.5" data-i="${i}" value="${val}" placeholder="kg"></td>
      <td><a class="video" href="${e[3]}" target="_blank" rel="noopener">Video</a></td>
    </tr>`;
  }).join("");
  document.querySelectorAll(".load").forEach(inp=>inp.addEventListener("input",()=>{
    let r=history.find(x=>x.date===today()&&x.day===currentDay);
    if(!r){r={date:today(),day:currentDay,loads:{}};history.push(r);}
    const v=inp.value;
    if(v==="") delete r.loads[inp.dataset.i]; else r.loads[inp.dataset.i]=Number(v);
    save(); renderHistory();
  }));
}
function renderHistory(){
  const dates=[...new Set(history.map(r=>r.date))].sort().reverse();
  $("historyList").innerHTML=dates.length ? dates.map(d=>{
    const days=history.filter(r=>r.date===d).map(r=>`Giorno ${r.day}`).join(", ");
    return `<div class="hist-row"><b>${fmt(d)}</b><span>${days}</span></div>`;
  }).join("") : `<div class="empty">Nessun allenamento salvato.</div>`;
}
function renderProgress(){
  const sel=$("progressExercise");
  if(!sel.options.length) sel.innerHTML=exList().map(e=>`<option>${e}</option>`).join("");
  const ex=sel.value;
  const points=[];
  history.forEach(r=>{
    const w=WORKOUTS.find(x=>x.day===r.day);
    if(!w) return;
    w.exercises.forEach((e,i)=>{
      if(e[0]===ex && r.loads && r.loads[i]!==undefined)
        points.push({date:r.date,value:Number(r.loads[i])});
    });
  });
  points.sort((a,b)=>a.date.localeCompare(b.date));
  const max=Math.max(...points.map(p=>p.value),10);
  const width=760,height=300,padL=55,padR=20,padT=25,padB=45;
  let svg=`<svg viewBox="0 0 ${width} ${height}" class="chart" role="img" aria-label="Progressi per ${ex}">`;
  for(let i=0;i<=4;i++){
    const y=padT+(height-padT-padB)*(1-i/4);
    const v=(max*i/4).toFixed(1).replace(".0","");
    svg+=`<line x1="${padL}" y1="${y}" x2="${width-padR}" y2="${y}" class="grid"></line><text x="${padL-8}" y="${y+4}" text-anchor="end" class="axis">${v}</text>`;
  }
  if(points.length){
    const xStep=(width-padL-padR)/Math.max(points.length-1,1);
    const pts=points.map((p,i)=>{
      const x=points.length===1?(width+padL-padR)/2:padL+i*xStep;
      const y=padT+(height-padT-padB)*(1-p.value/max);
      return {x,y,p};
    });
    svg+=`<polyline points="${pts.map(a=>`${a.x},${a.y}`).join(" ")}" class="line"></polyline>`;
    pts.forEach(a=>svg+=`<circle cx="${a.x}" cy="${a.y}" r="5" class="dot"></circle><text x="${a.x}" y="${height-18}" text-anchor="middle" class="axis">${fmt(a.p.date)}</text>`);
  } else {
    svg+=`<text x="${width/2}" y="${height/2}" text-anchor="middle" class="emptyText">Inserisci dei carichi per vedere i progressi</text>`;
  }
  svg+=`</svg>`;
  $("chartWrap").innerHTML=svg;
  $("progressTable").innerHTML=points.length ? points.slice().reverse().map((p,i)=>`<div class="progress-row"><span>${fmt(p.date)}</span><b>${p.value} kg</b><button type="button" class="edit-date" data-date="${p.date}">Modifica</button></div>`).join("") : "";
  document.querySelectorAll(".edit-date").forEach(b=>b.addEventListener("click",()=>openEditor(b.dataset.date)));
}
function openEditor(date){
  const rows=history.filter(r=>r.date===date);
  $("editDate").value=date;
  $("editRows").innerHTML=WORKOUTS.flatMap(w=>w.exercises.map((e,i)=>{
    const r=rows.find(x=>x.day===w.day);
    const v=r?.loads?.[i] ?? "";
    return `<div class="edit-item"><label>G${w.day} — ${e[0]}<input type="number" min="0" step="0.5" data-day="${w.day}" data-i="${i}" value="${v}" placeholder="kg"></label></div>`;
  })).join("");
  $("editModal").classList.add("show");
}
function closeEditor(){$("editModal").classList.remove("show");}
function saveEdited(){
  const date=$("editDate").value;
  if(!date)return;
  document.querySelectorAll("#editRows input").forEach(inp=>{
    const day=Number(inp.dataset.day), i=Number(inp.dataset.i), v=inp.value;
    let r=history.find(x=>x.date===date&&x.day===day);
    if(v!==""){
      if(!r){r={date,day,loads:{}};history.push(r);}
      r.loads[i]=Number(v);
    }else if(r?.loads?.[i]!==undefined){
      delete r.loads[i];
    }
  });
  history=history.filter(r=>Object.keys(r.loads||{}).length);
  save(); closeEditor(); renderWorkout(); renderHistory(); renderProgress();
}
document.querySelectorAll("[data-day]").forEach(btn=>btn.addEventListener("click",()=>{currentDay=Number(btn.dataset.day);renderWorkout();}));
$("progressExercise").addEventListener("change",renderProgress);
$("openProgress").addEventListener("click",()=>{ $("workoutView").classList.add("hidden");$("progressView").classList.remove("hidden");renderProgress();});
$("openWorkout").addEventListener("click",()=>{ $("progressView").classList.add("hidden");$("workoutView").classList.remove("hidden");});
$("closeEditor").addEventListener("click",closeEditor);
$("saveEditor").addEventListener("click",saveEdited);
$("cancelEditor").addEventListener("click",closeEditor);

renderWorkout(); renderHistory(); renderProgress();
</script>
