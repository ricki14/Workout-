<!doctype html><html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090b"><title>Riccardo Workout</title><style>
*{box-sizing:border-box}body{margin:0;background:#09090b;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header,main{max-width:900px;margin:auto;padding-left:16px;padding-right:16px}header{padding-top:26px}
.eyebrow{font-size:10px;letter-spacing:.16em;color:#9b9ba5;font-weight:800}h1{margin:5px 0;font-size:31px}
.hero{padding:22px 0 18px}.hero h2{margin:5px 0;font-size:25px}.hero p{margin:0;color:#9b9ba5;line-height:1.5}
.selector,.datebar,.history{background:#151518;border:1px solid #2b2b31;border-radius:17px;padding:15px;margin-bottom:18px}
label{display:block;color:#9b9ba5;font-size:10px;font-weight:800;letter-spacing:.12em;margin-bottom:8px}
select{width:100%;padding:13px;border-radius:12px;border:1px solid #38383f;background:#0f0f12;color:#fff;font-size:16px;font-weight:700}
.hidden{display:none}.datebar{display:flex;justify-content:space-between;gap:12px}.saved{color:#8fd19e;font-size:11px;font-weight:700}
.day{background:#151518;border:1px solid #2b2b31;border-radius:17px;margin:12px 0;overflow:hidden}
summary{list-style:none;padding:17px;font-weight:800;font-size:18px}.table{overflow:auto}
.th,.row{display:grid;grid-template-columns:minmax(220px,1fr) 85px 95px 140px 70px;min-width:670px;align-items:center}
.th{padding:11px 10px;background:#101014;color:#9b9ba5;font-size:9px;font-weight:800;letter-spacing:.08em}
.row{padding:13px 10px;border-top:1px solid #2b2b31;font-size:12px}.name{font-size:13px;font-weight:700}
.load{width:120px;padding:9px;border:1px solid #38383f;border-radius:9px;background:#0d0d10;color:#fff;font-size:13px}
.video{display:inline-flex;padding:8px;border-radius:9px;background:#fff;color:#09090b;text-decoration:none;font-weight:800;font-size:10px}
.note{color:#9b9ba5;font-size:11px;margin:10px 2px 30px}.history h3{margin:0 0 8px;font-size:15px}.history-item{border-top:1px solid #2b2b31;padding:8px 0;font-size:12px}
@media(max-width:700px){.th,.row{grid-template-columns:minmax(190px,1fr) 65px 72px 115px 65px;min-width:610px}.load{width:100px}}
</style></head>
<body><header><div class="eyebrow">PERSONAL WORKOUT</div><h1>Riccardo</h1></header><main>
<section class="hero"><div class="eyebrow">SCHEDA ATTIVA</div><h2>Allenamento</h2><p>Seleziona il giorno, inserisci i carichi e vengono salvati automaticamente con la data.</p></section>
<section class="selector"><label for="day">GIORNO DI ALLENAMENTO</label><select id="day"><option value="">Seleziona un giorno…</option><option value="0">Giorno 1</option><option value="1">Giorno 2</option><option value="2">Giorno 3</option><option value="3">Giorno 4</option></select></section>
<section id="datebar" class="datebar hidden"><div><div class="eyebrow">DATA SESSIONE</div><strong id="today"></strong></div><div id="saved" class="saved">Salvataggio automatico</div></section>
<section id="panel"></section><section id="history" class="history hidden"><h3>Ultimi allenamenti</h3><div id="historyList"></div></section>
</main><script>const WORKOUTS=[{"day": "GIORNO 1", "exercises": [{"name": "Panca inclinata 30 bilanciere", "sets": "4x8", "rest": "1’30’’/2’", "video": "https://vm.tiktok.com/ZGdQmw1Ex/"}, {"name": "Military press bilanciere", "sets": "4x8", "rest": "1’30’’/2’", "video": "https://vm.tiktok.com/ZGdQmve6p/"}, {"name": "Distensioni manubri panca piana", "sets": "4x10", "rest": "1’30’’", "video": "https://vm.tiktok.com/ZGdQm3fWo/"}, {"name": "Alzate laterali singole al cavo", "sets": "4x8", "rest": "1’30’’", "video": "https://vm.tiktok.com/ZGdQm7xu2/"}, {"name": "Chest press", "sets": "4x10", "rest": "1’30’’", "video": "https://vm.tiktok.com/ZGdQm7nSA/"}, {"name": "Shoulder press", "sets": "4x10", "rest": "1’30’’", "video": "https://vm.tiktok.com/ZGdQmno3r/"}, {"name": "Croci ai cavi alti", "sets": "3xmax", "rest": "1’30’’", "video": "https://vm.tiktok.com/ZGdQmTXda/"}, {"name": "Push up", "sets": "3x12", "rest": "1’30’’", "video": "https://vm.tiktok.com/ZGdQms2sN/"}]}, {"day": "GIORNO 2", "exercises": [{"name": "Lat machine", "sets": "4x10", "rest": "1’30’’", "video": "https://vm.tiktok.com/ZGdQmorHu/"}, {"name": "Pulley barra larga", "sets": "3x8", "rest": "1’30’’", "video": "https://vm.tiktok.com/ZGdQm75H5/"}, {"name": "Rowing machine braccio singolo", "sets": "3x8", "rest": "1’30’’", "video": "https://vm.tiktok.com/ZGdQm3ejY/"}, {"name": "Pulley triangolo", "sets": "3x10", "rest": "1’30’’", "video": "https://vm.tiktok.com/ZGdQmthQd/"}, {"name": "Pull up", "sets": "4x4", "rest": "1’30’’", "video": "https://vm.tiktok.com/ZGdQmTVXx/"}, {"name": "Raise alla sbarra", "sets": "3x12", "rest": "1’", "video": "https://vm.tiktok.com/ZGdQmwXUq/"}]}, {"day": "GIORNO 3", "exercises": [{"name": "Curl alternato in piedi", "sets": "4x8", "rest": "1’30’’", "video": "https://vm.tiktok.com/ZGdQuet9w/"}, {"name": "French press seduto braccio singolo", "sets": "4x8", "rest": "1’", "video": "https://vm.tiktok.com/ZGdQuNFuB/"}, {"name": "Curl bicipiti cavo basso corda", "sets": "4x10", "rest": "1’30’’", "video": "https://vm.tiktok.com/ZGdQu2UyY/"}, {"name": "Push down barra dritta", "sets": "4x10/12", "rest": "1’30’’", "video": "https://vm.tiktok.com/ZGdQm3LN3/"}, {"name": "Panca scott", "sets": "4x10", "rest": "1’30’’", "video": "https://vm.tiktok.com/ZGdQu1Ryo/"}, {"name": "Push down corda", "sets": "4x10", "rest": "1’/1’30’’", "video": "https://vm.tiktok.com/ZGdQmGL1Y/"}, {"name": "Push up", "sets": "3x12", "rest": "1’30’’", "video": "https://vm.tiktok.com/ZGdQudL9g/"}]}, {"day": "GIORNO 4", "exercises": [{"name": "Alzate laterali", "sets": "4x10", "rest": "1’30’’", "video": "https://vm.tiktok.com/ZGdQuLxBD/"}, {"name": "Front lever tuck", "sets": "4x4’’", "rest": "1’30’’", "video": "https://vm.tiktok.com/ZGdQmshJQ/"}, {"name": "Croci ai cavi bassi", "sets": "3x12", "rest": "1’30’’", "video": "https://vm.tiktok.com/ZGdQu2dF4/"}, {"name": "Pull up", "sets": "4x4", "rest": "1’30’’", "video": "https://vm.tiktok.com/ZGdQmEWjF/"}, {"name": "Raise alla sbarra", "sets": "3x12", "rest": "1’", "video": "https://vm.tiktok.com/ZGdQu2uke/"}, {"name": "Crunch", "sets": "3x20", "rest": "1’", "video": "https://vm.tiktok.com/ZGdQmGRHk/"}]}];
const workouts=WORKOUTS;
const select=document.getElementById('day'), panel=document.getElementById('panel');
const datebar=document.getElementById('datebar'), today=document.getElementById('today'), saved=document.getElementById('saved');
const history=document.getElementById('history'), historyList=document.getElementById('historyList');
const KEY='riccardo_workout_loads_v2';
const db=()=>JSON.parse(localStorage.getItem(KEY)||'{}');
const save=x=>localStorage.setItem(KEY,JSON.stringify(x));
const iso=()=>{const d=new Date();return d.toISOString().slice(0,10)};
const it=d=>{const p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0]};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function render(i){
 if(i===''){panel.innerHTML='';datebar.classList.add('hidden');return}
 const idx=Number(i), w=workouts[idx], date=iso(), key=date+'_'+idx, rec=db()[key]||{};
 datebar.classList.remove('hidden'); today.textContent=it(date);
 panel.innerHTML='<div class="day"><summary>'+esc(w.day)+'</summary><div class="table"><div class="th"><div>ESERCIZIO</div><div>SERIE × REP</div><div>RECUPERO</div><div>CARICO (kg)</div><div>VIDEO</div></div>'+
 w.exercises.map((e,j)=>'<div class="row"><div class="name">'+esc(e.name)+'</div><div>'+esc(e.sets)+'</div><div>'+esc(e.rest)+'</div><div><input class="load" inputmode="decimal" placeholder="es. 20" value="'+esc(rec[j]||'')+'" data-j="'+j+'"></div><div><a class="video" href="'+e.video+'" target="_blank" rel="noopener">🎥</a></div></div>').join('')+
 '</div></div><div class="note">💾 Il carico viene salvato automaticamente. La data della sessione viene registrata automaticamente.</div>';
 panel.querySelectorAll('.load').forEach(inp=>inp.addEventListener('input',()=>{
   const all=db(), k=date+'_'+idx, r=all[k]||{}; r[inp.dataset.j]=inp.value; all[k]=r; save(all);
   saved.textContent='✓ Salvato'; setTimeout(()=>saved.textContent='Salvataggio automatico',800); renderHistory();
 }));
 renderHistory();
}
function renderHistory(){
 const all=db(), items=Object.keys(all).filter(k=>Object.values(all[k]).some(v=>String(v).trim()!=='')).sort().reverse();
 if(!items.length){history.classList.add('hidden');return}
 history.classList.remove('hidden');
 historyList.innerHTML=items.slice(0,8).map(k=>{const p=k.split('_');return '<div class="history-item"><strong>'+workouts[Number(p[1])].day+'</strong> · '+it(p[0])+' · '+Object.values(all[k]).filter(Boolean).length+' carichi</div>'}).join('');
}
select.addEventListener('change',()=>render(select.value)); renderHistory();
</script></body></html>
